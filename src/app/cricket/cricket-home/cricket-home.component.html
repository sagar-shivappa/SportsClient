<div class="container">
  <div class="cricket_head">
    <h3>Cricket Rules {{ event.year }}</h3>
    <i class="fa-solid fa-calendar-days message">
      <strong>{{ event.date }}</strong>
    </i>
  </div>

  <ol>
    <li *ngFor="let rule of rules">
      {{ rule }}
      <br />
    </li>
  </ol>
</div>
